name: pro_validator
description: >-
  Composable, callable validators for Dart and Flutter: text, number and date
  validators, one-line custom checks, whole-model validation and 40+ string
  format checkers.

version: 3.0.0

repository: https://github.com/pro100andrey/validator
issue_tracker: https://github.com/pro100andrey/validator/issues
homepage: https://github.com/pro100andrey/validator
documentation: https://github.com/pro100andrey/validator/blob/main/README.md

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  pro_lints: ^6.1.0
  test: ^1.31.2
